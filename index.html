<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vue / Nuxt hosting picker, decision engine</title>
<style>body{font:16px/1.55 Georgia,serif;max-width:760px;margin:40px auto;padding:0 18px;color:#1d2a24}h1{font-size:1.6rem}select,button{font:inherit;padding:6px;margin:4px 0}li{margin:6px 0}a{color:#0b6b48}</style></head><body>
<h1>Vue / Nuxt hosting picker, decision engine</h1>
<p>The open logic of the <a href="https://vuetelemetry.com/vue-nuxt-hosting-picker">interactive Vue / Nuxt hosting picker</a>. Source and full table of answers: <a href="https://github.com/ricco020/vue-nuxt-hosting-picker">github.com/ricco020/vue-nuxt-hosting-picker</a>.</p>
<p><label>App <select id="mode"><option value="static">Static (SPA, nuxt generate)</option><option value="ssr" selected>Nuxt SSR</option><option value="full">SSR + API + database</option></select></label><br>
<label>Traffic <select id="traffic"><option value="low">Under 10k visits/mo</option><option value="mid">10k to 100k</option><option value="vhigh">Over 100k</option></select></label><br>
<label>Run a Linux server yourself? <select id="admin"><option value="yes">Yes</option><option value="no">No, managed</option></select></label><br>
<label>Region <select id="region"><option value="any">Any</option><option value="eu">Prefer Switzerland / EU</option></select></label></p>
<div id="out"></div>
<p>Why each plan, and the memory to plan for: <a href="https://vuetelemetry.com/articles/best-hosting-vue-nuxt-app">Best hosting for a Vue or Nuxt app</a>.</p>
<script src="picker.js"></script>
<script>
function run(){const v=id=>document.getElementById(id).value;const r=decide({mode:v('mode'),traffic:v('traffic'),admin:v('admin'),region:v('region')});
document.getElementById('out').innerHTML='<p><b>Model: '+r.model+'</b></p><ol>'+r.plans.map(k=>{const p=PLANS[k];return '<li>'+p.provider+' '+p.name+', '+p.specs+': <b>'+p.price+p.unit+'</b></li>'}).join('')+'</ol><p>Prices checked '+CHECKED+' (Contabo 2026-11-17).</p>'}
document.querySelectorAll('select').forEach(s=>s.onchange=run);run();
</script></body></html>
